<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>things i'm working on - Michael Vinh Pham</title>
    <style>
      :root {
        --bg: #ffffff;
        --bg-alt: #f0e9df;
        --text: #3b3631;
        --text-muted: #7a7168;
        --accent: #c4704b;
        --accent-hover: #a85a38;
        --border: #d9cfc3;
        --link: #b05c3a;
        --mono: 'Courier New', Courier, monospace;
        --sans: Georgia, 'Times New Roman', serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--sans);
        background-color: var(--bg);
        color: var(--text);
        font-size: 16px;
        line-height: 1.7;
      }

      .page {
        max-width: 700px;
        margin: 0 auto;
        padding: 40px 24px 60px;
      }

      .site-header {
        text-align: center;
        margin-bottom: 8px;
      }

      .site-header h1 {
        font-family: var(--mono);
        font-size: 15px;
        font-weight: bold;
        letter-spacing: 1px;
        text-transform: none;
        color: var(--text);
      }

      .site-nav {
        font-family: var(--mono);
        font-size: 12px;
        margin-top: 10px;
        display: inline-flex;
        gap: 4px;
        background: var(--bg-alt);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 6px;
      }

      .site-nav a {
        color: var(--text-muted);
        border-bottom: none;
        padding: 3px 10px;
        border-radius: 3px;
        transition: background 0.15s, color 0.15s;
      }

      .site-nav a:hover {
        color: var(--accent);
        background: var(--bg);
        border-bottom: none;
      }

      .site-nav a.active {
        color: var(--accent);
        background: var(--bg);
      }

      .site-nav .sep {
        color: var(--border);
        display: flex;
        align-items: center;
      }

      hr {
        border: none;
        height: 1px;
        background: var(--border);
        margin: 24px 0;
      }

      a {
        color: var(--link);
        text-decoration: none;
        border-bottom: 1px dotted var(--link);
        transition: color 0.15s, border-color 0.15s;
      }

      a:hover {
        color: var(--accent-hover);
        border-bottom-style: solid;
      }

      h2 {
        font-family: var(--mono);
        font-size: 15px;
        font-weight: normal;
        text-transform: uppercase;
        letter-spacing: 3px;
        color: var(--accent);
        margin-bottom: 16px;
      }

      h2::before {
        content: "# ";
      }

      .post {
        margin-bottom: 32px;
        padding-left: 16px;
        border-left: 2px solid var(--border);
      }

      .post:hover {
        border-left-color: var(--accent);
      }

      .post .post-title {
        font-weight: bold;
      }

      .post .post-date {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .post .post-body {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 8px;
        line-height: 1.6;
      }

      .empty-state {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--text-muted);
        padding: 24px 16px;
        background: var(--bg-alt);
        border: 1px solid var(--border);
        border-radius: 3px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <h1>Michael Vinh Pham</h1>
        <nav class="site-nav">
          <a href="index.html">~ home ~</a>
          <span class="sep">|</span>
          <a href="blog.html" class="active">~ things i'm working on ~</a>
        </nav>
      </header>

      <hr>

      <h2>Things I'm Working On</h2>

      <div id="posts-container">
        <div class="empty-state">loading...</div>
      </div>

    </div>
    <script>
      fetch('blogs/posts.json')
        .then(r => r.json())
        .then(posts => {
          const container = document.getElementById('posts-container');
          if (!posts.length) {
            container.innerHTML = '<div class="empty-state">nothing here yet -- check back soon.</div>';
            return;
          }
          posts.sort((a, b) => b.date.localeCompare(a.date));
          container.innerHTML = posts.map(p => `
            <div class="post">
              <a href="post.html?slug=${p.slug}" class="post-title">${p.title}</a>
              <div class="post-date">${p.date}</div>
              <div class="post-body">${p.description}</div>
            </div>
          `).join('');
        })
        .catch(() => {
          document.getElementById('posts-container').innerHTML =
            '<div class="empty-state">nothing here yet -- check back soon.</div>';
        });
    </script>
  </body>
</html>
