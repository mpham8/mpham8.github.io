<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Michael Vinh Pham</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      :root {
        --bg: #ffffff;
        --bg-alt: #f0e9df;
        --text: #3b3631;
        --text-muted: #7a7168;
        --accent: #c4704b;
        --accent-hover: #a85a38;
        --border: #d9cfc3;
        --link: #b05c3a;
        --mono: 'Courier New', Courier, monospace;
        --sans: Georgia, 'Times New Roman', serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--sans);
        background-color: var(--bg);
        color: var(--text);
        font-size: 16px;
        line-height: 1.7;
      }

      .page {
        max-width: 700px;
        margin: 0 auto;
        padding: 40px 24px 60px;
      }

      .site-header {
        text-align: center;
        margin-bottom: 8px;
      }

      .site-header h1 {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: normal;
        letter-spacing: 0;
        text-transform: none;
        color: var(--text-muted);
      }

      .site-nav {
        font-family: var(--mono);
        font-size: 12px;
        margin-top: 6px;
      }

      .site-nav a {
        color: var(--text-muted);
        border-bottom: none;
        margin: 0 8px;
      }

      .site-nav a:hover {
        color: var(--accent);
        border-bottom: none;
      }

      .site-nav a.active {
        color: var(--accent);
      }

      .site-nav .sep {
        color: var(--border);
      }

      hr {
        border: none;
        height: 1px;
        background: var(--border);
        margin: 24px 0;
      }

      a {
        color: var(--link);
        text-decoration: none;
        border-bottom: 1px dotted var(--link);
        transition: color 0.15s, border-color 0.15s;
      }

      a:hover {
        color: var(--accent-hover);
        border-bottom-style: solid;
      }

      /* --- Post Content --- */
      .post-content {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--text-muted);
        line-height: 1.7;
      }

      .post-content h1 {
        font-family: var(--mono);
        font-size: 15px;
        font-weight: normal;
        text-transform: uppercase;
        letter-spacing: 3px;
        color: var(--accent);
        margin-bottom: 16px;
      }

      .post-content h1::before {
        content: "# ";
      }

      .post-content h2 {
        font-family: var(--mono);
        font-size: 14px;
        font-weight: normal;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--accent);
        margin-top: 28px;
        margin-bottom: 12px;
      }

      .post-content h2::before {
        content: "## ";
      }

      .post-content h3 {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: bold;
        color: var(--accent);
        margin-top: 24px;
        margin-bottom: 8px;
      }

      .post-content p {
        margin-bottom: 14px;
      }

      .post-content ul, .post-content ol {
        margin-bottom: 14px;
        padding-left: 24px;
      }

      .post-content li {
        margin-bottom: 4px;
      }

      .post-content li::marker {
        color: var(--accent);
      }

      .post-content code {
        font-family: var(--mono);
        font-size: 12px;
        background: var(--bg-alt);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 1px 5px;
      }

      .post-content pre {
        background: var(--bg-alt);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 14px 16px;
        overflow-x: auto;
        margin-bottom: 16px;
      }

      .post-content pre code {
        background: none;
        border: none;
        padding: 0;
        font-size: 12px;
        line-height: 1.5;
      }

      .post-content blockquote {
        border-left: 2px solid var(--accent);
        padding-left: 16px;
        color: var(--text-muted);
        margin-bottom: 14px;
      }

      .back-link {
        font-family: var(--mono);
        font-size: 12px;
        display: inline-block;
        margin-bottom: 20px;
      }

      .error-state {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--text-muted);
        padding: 24px 16px;
        background: var(--bg-alt);
        border: 1px solid var(--border);
        border-radius: 3px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <h1>Michael Vinh Pham</h1>
        <nav class="site-nav">
          <a href="index.html">~ home ~</a>
          <span class="sep">|</span>
          <a href="blog.html" class="active">~ things i'm working on ~</a>
        </nav>
      </header>

      <hr>

      <a href="blog.html" class="back-link">&larr; back to all posts</a>

      <div id="post-content" class="post-content">
        <div class="error-state">loading...</div>
      </div>

    </div>
    <script>
      const slug = new URLSearchParams(window.location.search).get('slug');
      const container = document.getElementById('post-content');

      if (!slug) {
        container.innerHTML = '<div class="error-state">no post specified.</div>';
      } else {
        fetch(`blogs/${slug}.md`)
          .then(r => {
            if (!r.ok) throw new Error('not found');
            return r.text();
          })
          .then(md => {
            container.innerHTML = marked.parse(md);
            const title = container.querySelector('h1');
            if (title) {
              document.title = title.textContent + ' - Michael Vinh Pham';
            }
          })
          .catch(() => {
            container.innerHTML = '<div class="error-state">post not found.</div>';
          });
      }
    </script>
  </body>
</html>
