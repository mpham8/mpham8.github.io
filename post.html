<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Michael Vinh Pham</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)'], ['$', '$']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
        },
        svg: {
          scale: 1.3,
        },
        options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" id="MathJax-script"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github.min.css"
    >
    <style>
      :root {
        --bg: #ffffff;
        --bg-alt: #f0e9df;
        --text: #3b3631;
        --text-muted: #7a7168;
        --accent: #c4704b;
        --accent-hover: #a85a38;
        --border: #d9cfc3;
        --link: #b05c3a;
        --mono: 'Courier New', Courier, monospace;
        --sans: Georgia, 'Times New Roman', serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--sans);
        background-color: var(--bg);
        color: var(--text);
        font-size: 16px;
        line-height: 1.7;
      }

      .page {
        max-width: 700px;
        margin: 0 auto;
        padding: 40px 24px 60px;
      }

      .site-header {
        text-align: center;
        margin-bottom: 8px;
      }

      .site-header h1 {
        font-family: var(--mono);
        font-size: 15px;
        font-weight: bold;
        letter-spacing: 1px;
        text-transform: none;
        color: var(--text);
      }

      .site-nav {
        font-family: var(--mono);
        font-size: 12px;
        margin-top: 10px;
        display: inline-flex;
        gap: 4px;
        background: var(--bg-alt);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 6px;
      }

      .site-nav a {
        color: var(--text-muted);
        border-bottom: none;
        padding: 3px 10px;
        border-radius: 3px;
        transition: background 0.15s, color 0.15s;
      }

      .site-nav a:hover {
        color: var(--accent);
        background: var(--bg);
        border-bottom: none;
      }

      .site-nav a.active {
        color: var(--accent);
        background: var(--bg);
      }

      .site-nav .sep {
        color: var(--border);
        display: flex;
        align-items: center;
      }

      hr {
        border: none;
        height: 1px;
        background: var(--border);
        margin: 24px 0;
      }

      a {
        color: var(--link);
        text-decoration: none;
        border-bottom: 1px dotted var(--link);
        transition: color 0.15s, border-color 0.15s;
      }

      a:hover {
        color: var(--accent-hover);
        border-bottom-style: solid;
      }

      /* --- Post Content --- */
      .post-content {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--text-muted);
        line-height: 1.7;
      }

      .post-content h1 {
        font-family: var(--mono);
        font-size: 15px;
        font-weight: normal;
        text-transform: uppercase;
        letter-spacing: 3px;
        color: var(--accent);
        margin-bottom: 16px;
      }

      .post-content h1::before {
        content: "# ";
      }

      .post-content h2 {
        font-family: var(--mono);
        font-size: 14px;
        font-weight: normal;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--accent);
        margin-top: 28px;
        margin-bottom: 12px;
      }

      .post-content h2::before {
        content: "## ";
      }

      .post-content h3 {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: bold;
        color: var(--accent);
        margin-top: 24px;
        margin-bottom: 8px;
      }

      .post-content p {
        margin-bottom: 14px;
      }

      .post-content strong {
        font-weight: bold;
        color: var(--text);
      }

      .post-content em {
        font-style: italic;
      }

      .post-content ul, .post-content ol {
        margin-bottom: 14px;
        padding-left: 24px;
      }

      .post-content li {
        margin-bottom: 4px;
      }

      .post-content li::marker {
        color: var(--accent);
      }

      .post-content code {
        font-family: var(--mono);
        font-size: 12px;
        background: var(--bg-alt);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 1px 5px;
      }

      .post-content pre {
        background: var(--bg-alt);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 14px 16px;
        overflow-x: auto;
        margin-bottom: 16px;
      }

      .post-content pre code {
        background: none;
        border: none;
        padding: 0;
        font-size: 12px;
        line-height: 1.5;
      }

      .post-content pre code.hljs {
        background: transparent;
      }

      .post-content blockquote {
        border-left: 2px solid var(--accent);
        padding-left: 16px;
        color: var(--text-muted);
        margin-bottom: 14px;
      }

      .post-content img {
        display: block;
        margin: 16px auto;
        max-width: 100%;
        height: auto;
      }

      .post-content figure {
        margin: 16px 0 20px;
        text-align: center;
      }

      .post-content figure > img {
        margin-bottom: 8px;
      }

      .post-content figcaption {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.5;
      }

      .back-link {
        font-family: var(--mono);
        font-size: 12px;
        display: inline-block;
        margin-bottom: 20px;
      }

      .error-state {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--text-muted);
        padding: 24px 16px;
        background: var(--bg-alt);
        border: 1px solid var(--border);
        border-radius: 3px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <h1>Michael Vinh Pham</h1>
        <nav class="site-nav">
          <a href="index.html">~ home ~</a>
          <span class="sep">|</span>
          <a href="blog.html" class="active">~ things i'm working on ~</a>
        </nav>
      </header>

      <hr>

      <a href="blog.html" class="back-link">&larr; back to all posts</a>

      <div id="post-content" class="post-content">
        <div class="error-state">loading...</div>
      </div>

    </div>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js"></script>
    <script>
      /**
       * Markdown strips `\` before `(` etc., which breaks MathJax `\(` `\)` and `\[` `\]`.
       * Pull math (and display `$$`) out before marked.parse; skip fenced ``` and inline `…`.
       */
      function prepareMarkdownForMath(md) {
        const chunks = [];
        const token = (i) => 'MJPH' + i + 'MJEND';

        function protectMathInPlainText(s) {
          return s
            .replace(/\$\$[\s\S]*?\$\$/g, (m) => {
              chunks.push(m);
              return token(chunks.length - 1);
            })
            .replace(/\\\[[\s\S]*?\\\]/g, (m) => {
              chunks.push(m);
              return token(chunks.length - 1);
            })
            .replace(/\\\([\s\S]*?\\\)/g, (m) => {
              chunks.push(m);
              return token(chunks.length - 1);
            });
        }

        function processOutsideFences(segment) {
          let out = '';
          let i = 0;
          while (i < segment.length) {
            if (segment[i] === '`') {
              let j = i + 1;
              while (j < segment.length && segment[j] !== '`') j++;
              out += segment.slice(i, j + 1);
              i = j + 1;
              continue;
            }
            let j = i;
            while (j < segment.length && segment[j] !== '`') j++;
            out += protectMathInPlainText(segment.slice(i, j));
            i = j;
          }
          return out;
        }

        let out = '';
        let pos = 0;
        while (pos < md.length) {
          const tail = md.slice(pos);
          const fenceAt = tail.search(/^```/m);
          if (fenceAt === 0) {
            const m = tail.match(/^```[\s\S]*?^```/m);
            if (m) {
              out += m[0];
              pos += m[0].length;
              continue;
            }
            const nl = tail.indexOf('\n');
            const skip = nl === -1 ? tail.length : nl + 1;
            out += tail.slice(0, skip);
            pos += skip;
            continue;
          }
          const nextFence = fenceAt === -1 ? tail.length : fenceAt;
          out += processOutsideFences(tail.slice(0, nextFence));
          pos += nextFence;
        }

        return { md: out, chunks };
      }

      function restoreMathPlaceholders(html, chunks) {
        for (let i = 0; i < chunks.length; i++) {
          html = html.split('MJPH' + i + 'MJEND').join(chunks[i]);
        }
        return html;
      }

      const slug = new URLSearchParams(window.location.search).get('slug');
      const container = document.getElementById('post-content');

      if (!slug) {
        container.innerHTML = '<div class="error-state">no post specified.</div>';
      } else {
        fetch(`blogs/${slug}.md`)
          .then(r => {
            if (!r.ok) throw new Error('not found');
            return r.text();
          })
          .then(md => {
            const { md: safeMd, chunks } = prepareMarkdownForMath(md);
            let html = marked.parse(safeMd);
            html = restoreMathPlaceholders(html, chunks);
            container.innerHTML = html;
            if (window.hljs) {
              container.querySelectorAll('pre code').forEach((el) => {
                hljs.highlightElement(el);
              });
            }
            const title = container.querySelector('h1');
            if (title) {
              document.title = title.textContent + ' - Michael Vinh Pham';
            }
            const mj = window.MathJax;
            if (mj && mj.typesetPromise) {
              return mj.typesetPromise([container]);
            }
          })
          .catch(() => {
            container.innerHTML = '<div class="error-state">post not found.</div>';
          });
      }
    </script>
  </body>
</html>
